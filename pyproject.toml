[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "photomechbench-construction"
version = "0.1.0"
description = "Canonical construction and audit pipeline for PhotoMechBench raw cases"
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.20,<5",
  "mineru-open-sdk>=0.1.1,<0.2",
  "openai>=1.30,<2",
  "Pillow>=9,<12",
]

[project.scripts]
photomechbench = "aie_ddxbench_construction.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aie_ddxbench_construction = [
  "prompts/*.md",
  "schemas/*.json",
]
